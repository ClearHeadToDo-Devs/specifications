name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # V5: merge, reason, verify, check competency answers, lint (v5/Makefile).
  robot:
    runs-on: ubuntu-latest
    env:
      ROBOT_VERSION: v1.9.10
      ROBOT_SHA256: 16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ROBOT (pinned by checksum)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/ontodev/robot/releases/download/$ROBOT_VERSION/robot.jar" -o "$HOME/bin/robot.jar"
          echo "$ROBOT_SHA256  $HOME/bin/robot.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -jar "%s/bin/robot.jar" "$@"\n' "$HOME" > "$HOME/bin/robot"
          chmod +x "$HOME/bin/robot"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run the gate
        run: make -C v5 test
